<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2F77"/>
      <stop offset="100%" stop-color="#5B4FE0"/>
    </linearGradient>
  </defs>

  <!-- Background - same gradient as MX3 Button Mapper's icon, for a
       cohesive "MX3 family" look across both apps -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 3x3 grid of app tiles - the literal core feature of the launcher.
       Kept upright (not rotated, unlike the sibling remote icon) since a
       grid reads most clearly as "a grid" when axis-aligned. -->
  <g>
    <!-- Row 1 -->
    <rect x="91"  y="91"  width="90" height="90" rx="22" fill="#1D1E24"/>
    <rect x="211" y="91"  width="90" height="90" rx="22" fill="#1D1E24"/>
    <rect x="331" y="91"  width="90" height="90" rx="22" fill="#1D1E24"/>

    <!-- Row 2 -->
    <rect x="91"  y="211" width="90" height="90" rx="22" fill="#1D1E24"/>
    <!-- Accent tile - ties to the cyan highlight used throughout the
         sibling Button Mapper icon (sensor dot, d-pad center, motion arcs) -->
    <rect x="211" y="211" width="90" height="90" rx="22" fill="#5CE1E6"/>
    <rect x="331" y="211" width="90" height="90" rx="22" fill="#1D1E24"/>

    <!-- Row 3 -->
    <rect x="91"  y="331" width="90" height="90" rx="22" fill="#1D1E24"/>
    <rect x="211" y="331" width="90" height="90" rx="22" fill="#1D1E24"/>
    <rect x="331" y="331" width="90" height="90" rx="22" fill="#1D1E24"/>
  </g>
</svg>
