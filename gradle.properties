org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Previously this file opted out of both android.builtInKotlin and
# android.newDsl to stay on the traditional org.jetbrains.kotlin.android
# plugin + old DSL path. As of the AGP version this project now pins
# (9.3.1), that opt-out itself is the deprecated state -- builtInKotlin
# defaults to true, and the old DSL opt-out is scheduled for removal in
# AGP 10.0. Migrated fully to the modern path instead: no opt-out flags
# needed here at all, the org.jetbrains.kotlin.android plugin has been
# removed from build.gradle.kts, and AGP's built-in Kotlin support now
# handles Kotlin compilation directly. This also resolves the
# applicationVariants/testVariants/unitTestVariants legacy-API warnings,
# since those were a side effect of the newDsl=false opt-out re-enabling
# AGP's old variant-API compatibility shims -- removing that flag clears
# all three at once.
