org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# No android.builtInKotlin/android.newDsl opt-out here: AGP 9.3.1 makes
# built-in Kotlin the default, and that opt-out is deprecated (removed in
# AGP 10.0). This also clears the applicationVariants/testVariants/
# unitTestVariants legacy-API warnings, a side effect of the old
# newDsl=false opt-out re-enabling AGP's legacy variant-API shims.
